<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aulas de Javascript</title>
</head>
<body>
  <form id="formCadastro">
  <input type="text" id="nome" placeholder="Digite seu nome">
  <input type="number" id="idade" placeholder="Digite sua idade">
  <button type="submit">Cadastrar</button>
</form>

  <script>
    const form = document.querySelector("#formCadastro");

form.addEventListener("submit", function(event){

  event.preventDefault();

  try {

    const nome = document.querySelector("#nome").value;
    const idade = Number(document.querySelector("#idade").value);

    if(nome === ""){
      throw new Error("O nome é obrigatório.");
    }

    if(isNaN(idade)){
      throw new Error("A idade precisa ser um número.");
    }

    if(idade < 18){
      throw new Error("Você precisa ser maior de idade.");
    }

    console.log("Cadastro realizado com sucesso!");

  } catch(error){

    console.log(error.message);

  } finally{

    console.log("Tentativa de cadastro finalizada.");

  }

});
  </script>
</body>
</html>
